name: CancelIt
options:
  bundleIdPrefix: app.cancelit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.0.0
targets:
  CancelIt:
    type: application
    platform: iOS
    sources:
      - CancelIt
    resources:
      - CancelIt/Resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cancelit.ios
        INFOPLIST_FILE: CancelIt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CancelIt/Resources/CancelIt.entitlements
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -D DEBUG"
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

