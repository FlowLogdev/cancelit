name: CancelIt
options:
  bundleIdPrefix: app.cancelit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  XCTestDynamicOverlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    from: 1.10.1
targets:
  CancelIt:
    type: application
    platform: iOS
    sources:
      - CancelIt
    resources:
      - CancelIt/Resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
      - package: RevenueCat
        product: RevenueCat
      - package: XCTestDynamicOverlay
        product: IssueReporting
      - package: XCTestDynamicOverlay
        product: XCTestDynamicOverlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cancelit.ios
        INFOPLIST_FILE: CancelIt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CancelIt/Resources/CancelIt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -D DEBUG"
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: ""
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
