name: iOS App Store Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload CancelIt
    runs-on: macos-26

    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}

    defaults:
      run:
        working-directory: ios/CancelIt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write export options
        run: |
          set -euo pipefail

          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive
        run: |
          set -euo pipefail

          build_settings=()
          if [ -n "${REVENUECAT_API_KEY:-}" ]; then
            build_settings+=(REVENUECAT_API_KEY="$REVENUECAT_API_KEY")
          fi

          xcodebuild \
            -project CancelIt.xcodeproj \
            -scheme CancelIt \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/CancelIt.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive \
            "${build_settings[@]}"

      - name: Export and upload to App Store Connect
        run: |
          set -euo pipefail

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/CancelIt.xcarchive" \
            -exportPath "$PWD/build/AppStoreConnectUpload" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
